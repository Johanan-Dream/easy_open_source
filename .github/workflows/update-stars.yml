name: Update GitHub star snapshots

on:
  schedule:
    # 00:00, 08:00, 16:00 KST (UTC 기준 전날 15:00, 당일 23:00, 07:00)
    - cron: "0 7,15,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-star-snapshots
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Collect public repository metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run collect

      - name: Validate collected guides and rankings
        run: npm test

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repositories.json data/star-history.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "chore: update GitHub star snapshots"
            git push
          fi
