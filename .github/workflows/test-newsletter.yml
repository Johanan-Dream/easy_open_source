name: Test newsletter draft

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Send draft to test recipient only
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          NEWSLETTER_TEST_RECIPIENT: ${{ secrets.NEWSLETTER_TEST_RECIPIENT }}
        run: node scripts/send-newsletter-test.ts
